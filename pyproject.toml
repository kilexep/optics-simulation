[project]
name = "optics-simulation"
version = "0.1.0"
description = "STL-based PET bottle caustic simulation and pattern optimization"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "trimesh>=4.0",
    "numpy>=1.26",
    "rtree>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false