angle_scan:
  incident_angle_degrees:
    range: [0.0, 80.0]
    coarse_step: 5.0
    fine_step: 1.0
    optional_final_step: 0.5

  risk_region:
    metric: OFRI
    threshold_fraction_of_max: 0.8

  bottle_rotation_degrees:
    screening: [0.0, 90.0, 180.0, 270.0]
    final_step: 30.0

  target_distances_mm:
    screening: [50.0, 100.0]
    final: [50.0, 75.0, 100.0, 150.0]

  output:
    save_angle_response_csv: true
    save_plots: true
