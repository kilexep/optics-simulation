geometry:
  input_stl_path: data/stl/bottle.stl
  units: mm

  axis:
    assumed_bottle_axis: z
    auto_align: true

  mesh_quality:
    require_watertight: false
    repair_enabled: true
    recompute_normals: true
    check_normal_orientation: true

  surface_coordinates:
    type: normalized_cylindrical
    u_range: [0.0, 1.0]
    v_range: [0.0, 1.0]

  wall_model:
    mode: approximate_offset_inner_surface
    default_wall_thickness_mm: 0.5
    min_wall_thickness_mm: 0.2

  detector:
    default_distance_mm: 100.0
    width_mm: 160.0
    height_mm: 160.0
    resolution_px: [256, 256]
